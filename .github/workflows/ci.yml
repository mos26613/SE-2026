name: CI Pipeline & Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Linting & Unit Tests (US 1.4.2)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 black

      - name: Code formatting and linting check (Task 1.4.2.2)
        run: |
          flake8 backend/app backend/tests --count --max-line-length=127 --extend-ignore=E203,W503 --statistics

      - name: Run automated Pytest test suite (Task 1.4.2.3)
        run: |
          pytest backend -v

  extension-tests:
    name: Chrome Extension Tests (US 2.1.1, US 2.1.4, US 2.2.1)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install extension test dependencies
        working-directory: ./extension
        run: npm install

      - name: Run Node test runner
        working-directory: ./extension
        run: npm test

  quality-gate:
    name: Quality Gate Enforcement (Task 1.4.2.4)
    needs: [backend-quality, extension-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all CI gates passed
        run: |
          echo "All automated quality gates and unit tests passed successfully."
          echo "Pull request is eligible for code review and merging into main."
