server {
  listen 3000;
  root /usr/share/nginx/html;

  # React Router: unknown paths (e.g. /login) load the app, which picks the page.
  location / {
    try_files $uri /index.html;
  }

  # Built files have a content hash in their name, so they can be cached for long.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
