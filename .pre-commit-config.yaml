# Runs before every commit, on your computer (US 1.3.2). Install once: pip install pre-commit && pre-commit install
# If it finds a secret (an API key, a token, a password), the commit is stopped.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
