<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Smart Student Task Hub</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 320px;
      margin: 0;
      padding: 16px;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .header h1 {
      font-size: 15px;
      margin: 0;
      color: #1e293b;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge.connected { background: #dcfce7; color: #166534; }
    .badge.expired { background: #fee2e2; color: #991b1b; }
    .badge.syncing { background: #fef9c3; color: #854d0e; }
    .badge.neutral { background: #e2e8f0; color: #475569; }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: currentColor;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .meta {
      color: #64748b;
      font-size: 12px;
      margin-top: 4px;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary {
      background-color: #4f46e5;
      color: #ffffff;
      margin-bottom: 8px;
    }
    .btn-primary:hover { background-color: #4338ca; }
    .btn-primary:disabled { background-color: #94a3b8; cursor: not-allowed; }
    .btn-secondary {
      background-color: #ffffff;
      color: #334155;
      border: 1px solid #cbd5e1;
    }
    .btn-secondary:hover { background-color: #f1f5f9; }
    .alert {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 10px;
    }
    .alert a { color: #991b1b; font-weight: bold; }
    .token-box {
      margin-top: 10px;
      border-top: 1px dashed #cbd5e1;
      padding-top: 10px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 11px;
      margin-top: 4px;
      direction: ltr;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Academic Task Manager</h1>
    <span id="statusBadge" class="badge neutral">
      <span class="dot"></span>
      <span id="statusText">ממתין</span>
    </span>
  </div>

  <div id="sessionAlert" class="alert">
    תוקף ההתחברות ל-Moodle פג. 
    <a href="https://moodle.jct.ac.il" target="_blank">התחבר מחדש למודל</a>
  </div>

  <div id="errorAlert" class="alert"></div>

  <div class="card">
    <div><strong>סטטוס סנכרון מול השרת</strong></div>
    <div id="lastSyncText" class="meta">טרם בוצע סנכרון</div>
  </div>

  <button id="syncBtn" class="btn-primary">סנכרן מטלות עכשיו (Sync Now)</button>
  <button id="openDashboardBtn" class="btn-secondary">פתח לוח בקרה (Dashboard)</button>

  <div class="token-box">
    <label for="jwtInput" style="font-size: 11px; color: #475569;">Supabase JWT Token (זמני לפיתוח):</label>
    <input type="password" id="jwtInput" placeholder="הדבק טוקן אימות..." />
  </div>

  <script src="popup.js"></script>
</body>
</html>
